name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out build bundle
        uses: actions/checkout@v4

      - name: Verify and extract Android source
        run: |
          echo "eb823faa141ca859ec5bf84f841a2044fba97fdd644b7b5b88dca6768331af90  SpiderFootAndroid-4.0.0-ci-source.zip" | sha256sum --check --strict
          unzip -q SpiderFootAndroid-4.0.0-ci-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: SpiderFootAndroid/app/src/main/python/requirements-android.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test embedded SpiderFoot core
        working-directory: SpiderFootAndroid
        run: |
          python3.10 -m pip install -r app/src/main/python/requirements-android.txt
          python3.10 tools/smoke_test.py

      - name: Build installable debug APK
        working-directory: SpiderFootAndroid
        run: gradle :app:assembleDebug -PpythonCommand="$(command -v python3.10)" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiderFoot-4.0.0-Android-arm64
          path: SpiderFootAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
